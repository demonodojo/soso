[package]
name = "soso-update"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"

[[bin]]
name = "soso-update"
path = "src/main.rs"

[dependencies]
soso-abi = { workspace = true }
libsoso = { workspace = true }
soso-http = { path = "../../crates/soso-http" }
soso-update-core = { path = "../../crates/soso-update-core" }
# Sólo para mirar el disco de **otra** máquina desde el live: su GPT, su ESP
# y su sosofs. Todo de lectura; escribir en el disco ajeno es del kernel de esa
# máquina, que es quien puede tomar la exclusión y llevar el diario.
gptdisk = { path = "../../crates/gptdisk" }
espfat-core = { path = "../../crates/espfat-core" }
sosofs = { path = "../../crates/sosofs" }
block-dev = { path = "../../crates/block-dev" }
