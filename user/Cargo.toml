# Workspace de userspace: se compila para x86_64-unknown-none con el
# linker script link.ld (binarios ET_EXEC a 0x400000). Excluido del
# workspace raíz; xtask lo compila y copia los ELF a rootfs/bin.
[workspace]
resolver = "2"
members = ["libsoso", "init", "sosh", "coreutils", "soso-gpu", "soso-llm", "soso-hf", "soso-voz", "soso-web", "soso-update", "soso-ed", "soso-forja", "hola-std"]

[workspace.dependencies]
soso-abi = { path = "../crates/soso-abi" }
libsoso = { path = "libsoso" }
soso-update-core = { path = "../crates/soso-update-core" }
getrandom = { version = "0.2", features = ["rdrand"] }

[profile.release]
panic = "abort"
opt-level = "s"
# Sin debug info: cada spawn lee el ELF entero del FS (checksums incluidos).
strip = "debuginfo"

[profile.dev]
panic = "abort"
