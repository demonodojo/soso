# Workspace de userspace: se compila para x86_64-unknown-none con el
# linker script link.ld (binarios ET_EXEC a 0x400000). Excluido del
# workspace raíz; xtask lo compila y copia los ELF a rootfs/bin.
[workspace]
resolver = "2"
members = ["libsoso", "init", "sosh", "coreutils", "soso-gpu", "soso-llm", "soso-hf", "soso-voz", "soso-web", "soso-update", "soso-ed", "soso-forja", "hola-std", "soso-std-test", "soso-git", "soso-test-sosofs", "soso-rustc", "soso-improve", "soso-agent-probe"]

[workspace.dependencies]
soso-abi = { path = "../crates/soso-abi" }
libsoso = { path = "libsoso" }
soso-update-core = { path = "../crates/soso-update-core" }
# `custom`, no `rdrand`: la entropía la da el kernel por `SYS_GETRANDOM`, que
# ya la tiene. Con el backend de CPU, un proceso de usuario depende de que
# RDRAND esté disponible **y** de que su detección por CPUID acierte —bajo TCG
# no acierta—, y el fallo aparece como «TLS: failed to get random bytes» al
# primer handshake, que no se parece en nada a su causa.
getrandom = { version = "0.2", features = ["custom"] }

[profile.release]
panic = "abort"
opt-level = "s"
# Sin debug info: cada spawn lee el ELF entero del FS (checksums incluidos).
strip = "debuginfo"

[profile.dev]
panic = "abort"
