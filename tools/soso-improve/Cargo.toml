[package]
name = "soso-improve"
version = "0.1.0"
edition = "2021"

# Coordinador de automejora en el host (C5). La lógica vive en
# `soso-improve-core`, que es `no_std + alloc`: aquí solo está lo que necesita
# un sistema operativo con `std` —archivos, procesos y git— para que la misma
# lógica pueda hospedarse también dentro de soso.
[lib]
name = "soso_improve"
path = "src/lib.rs"

[[bin]]
name = "soso-improve"
path = "src/main.rs"

[dependencies]
soso-improve-core = { path = "../../crates/soso-improve-core", features = ["std"] }
soso-llm-core = { path = "../../crates/soso-llm-core", features = ["std"] }
sosomodel = { path = "../../crates/sosomodel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
