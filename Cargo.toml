[workspace]
resolver = "2"
members = [
    "xtask",
    "crates/block-dev",
    "crates/sosofs",
    "crates/soso-abi",
    "tools/mkfs-soso",
]
# El kernel y el userspace se compilan para x86_64-unknown-none con su propio
# árbol de dependencias; los excluimos para que `cargo build` en la raíz no
# intente compilarlos para el host.
exclude = ["kernel", "user"]
