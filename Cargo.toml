[workspace]
resolver = "2"
members = [
    "xtask",
    "crates/block-dev",
    "crates/sosofs",
    "crates/sosomfs",
    "crates/soso-abi",
    "crates/gptdisk",
    "crates/sosomodel",
    "crates/soso-llm-core",
    "crates/soso-gpu",
    "tools/mkfs-soso",
    "tools/mkfs-sosomfs",
    "tools/mkmodel-soso",
    "tools/convert-gguf",
    "crates/gguf2som",
    "crates/soso-http",
    "tools/cuda-proxy",
]
# El kernel y el userspace se compilan para x86_64-unknown-none (y el shim de
# arranque para x86_64-unknown-uefi) con su propio árbol de dependencias; los
# excluimos para que `cargo build` en la raíz no intente compilarlos para el host.
exclude = ["kernel", "user", "boot-shim"]
