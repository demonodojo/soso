[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
build = "build.rs"

[features]
default = ["drv-all"]
lxdde = []
# Meta-feature: todos los drivers nativos (compatibilidad con cargo xtask test).
drv-all = [
    "drv-virtio-blk",
    "drv-virtio-net",
    "drv-e1000e",
    "drv-rtl8169",
    "drv-nvme",
    "drv-usb",
    "drv-gpu-nvidia",
    "drv-live-disk",
    "drv-hda",
]
drv-virtio-blk = []
drv-virtio-net = []
drv-e1000e = []
drv-rtl8169 = []
drv-nvme = []
drv-usb = []
drv-gpu-nvidia = []
drv-live-disk = ["drv-virtio-blk", "drv-nvme", "drv-usb"]
drv-hda = []

[dependencies]
bootloader_api = "0.11.15"
# Sin default features: "default" arrastra "nightly" -> "step_trait", que
# implementa métodos del trait unstable Step que cambian entre nightlies.
x86_64 = { version = "0.15.5", default-features = false, features = ["instructions", "abi_x86_interrupt"] }
uart_16550 = "0.3"
spin = { version = "0.9", features = ["lock_api"] }
pic8259 = "0.11"
virtio-drivers = "0.13"
sosofs = { path = "../crates/sosofs" }
sosomfs = { path = "../crates/sosomfs" }
# Explícita, no sólo a través de `sosomfs`: el dispositivo software de la GPU
# descuantiza con `sosomodel::dequant` para poder ejecutar `MATVQ`, que es lo único
# que da cobertura numérica al camino de pesos cuantizados en GPU sin silicio.
sosomodel = { path = "../crates/sosomodel" }
block-dev = { path = "../crates/block-dev" }
soso-abi = { path = "../crates/soso-abi" }
xmas-elf = "0.10"
smoltcp = { version = "0.13.1", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-tcp",
    "socket-udp",
    "socket-dhcpv4",
    "alloc",
] }
talc = { version = "4", default-features = false, features = ["lock_api"] }
sunset = { version = "0.5", default-features = false, features = ["alloc"] }
xhci-nostd = { path = "../crates/xhci-nostd" }
log = { version = "0.4", default-features = false }
# Misma versión que usa sunset: Cargo unifica la instancia, así podemos
# construir una sunset::SignKey::Ed25519 desde una semilla de 32 bytes
# (la host key persistente de /etc/ssh_host_key) sin la feature openssh-key.
ed25519-dalek = { version = "2.1", default-features = false }
# Aleatoriedad en bare-metal: backend RDRAND (instrucción del x86, QEMU la
# soporta). Sin esto getrandom no compila para el target del kernel.
getrandom = { version = "0.2", features = ["rdrand"] }
sha1 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
# Fuente 8×8 VGA (public domain) para la consola GOP en placa.
font8x8 = { version = "0.3", default-features = false }

# Crate independiente del workspace raíz: se compila solo para
# x86_64-soso (target JSON) a través de xtask.
[workspace]

# sunset con un parche propio: no espejar el ChannelEof del par (rompía la
# salida de cualquier sesión cuyo cliente cerrara stdin). Detalle y diff en
# vendor/README.md.
[patch.crates-io]
sunset = { path = "../vendor/sunset-0.5.0" }

[profile.dev]
panic = "abort"

# El kernel se compila en `dev` (los tests y el ciclo de trabajo van así), pero
# hay dependencias que están en el camino caliente y no queremos sin optimizar.
#
# `crc` es la peor: sosomfs verifica el CRC32C de cada extent al leerlo, y sin
# optimizar eso son 15 MB/s. Medido el 2026-08-02 con el modelo `tiny`: **278 ms
# de CRC** sobre 4,3 MiB en una inferencia de 2,8 s. Optimizar sólo este paquete
# no cambia la depurabilidad del kernel, que sigue en dev.
[profile.dev.package.crc]
opt-level = 3
[profile.dev.package.sosomfs]
opt-level = 3
[profile.dev.package.sosofs]
opt-level = 3

[profile.release]
panic = "abort"
