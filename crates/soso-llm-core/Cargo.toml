[package]
name = "soso-llm-core"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"

[features]
default = []
# `std` no debe colarse en el guest a través de una dependencia: serde y
# serde_json van con `default-features = false` y solo suben a std si se pide
# esta característica de forma explícita (C1).
std = ["serde/std", "serde_json/std"]

[dev-dependencies]
soso-audio = { path = "../soso-audio", features = ["std"] }

[dependencies]
sosomodel = { path = "../sosomodel" }
libm = "0.2"
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[lib]
doctest = false
