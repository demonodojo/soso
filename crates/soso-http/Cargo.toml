[package]
name = "soso-http"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
build = "build.rs"

[features]
default = []
std = []

[build-dependencies]
cc = "1"

[dependencies]
soso-abi = { path = "../soso-abi" }
# `custom`, no `rdrand`. Las features se unifican en todo el grafo y en
# getrandom 0.2 el backend de CPU se elige ANTES que el personalizado, así
# que pedir `rdrand` aquí anula el `register_custom_getrandom!` de libsoso
# aunque el binario de usuario pida `custom`. La entropía la da el kernel.
getrandom = { version = "0.2", features = ["custom"] }
ring = { version = "0.17", features = ["less-safe-getrandom-custom-or-rdrand"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
