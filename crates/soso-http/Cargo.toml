[package]
name = "soso-http"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
build = "build.rs"

[features]
# Proveedor criptográfico de rustls. `crypto-ring` (el de siempre) necesita un compilador
# de C y ensamblador para `ring`; `crypto-rust` (RustCrypto, Rust puro) no: es el que usa la
# compilación dentro de soso mientras el guest no tenga C (T42, C-115). Si se piden
# los dos gana `ring`.
default = ["crypto-ring", "pq"]
std = ["rustls/std"]
pq = [
    "dep:ml-kem",
    "dep:ml-dsa",
    "dep:x25519-dalek",
    "dep:rustls-pki-types",
    "dep:signature3",
]
crypto-ring = ["dep:ring", "dep:cc", "rustls/ring"]
crypto-rust = ["dep:rustls-rustcrypto"]

[build-dependencies]
# Sólo con `crypto-ring`: `cc` no compila en soso (no hay ficheros temporales con nombre).
cc = { version = "1", optional = true }

[dependencies]
soso-abi = { path = "../soso-abi" }
# `custom`, no `rdrand`. Las features se unifican en todo el grafo y en
# getrandom 0.2 el backend de CPU se elige ANTES que el personalizado, así
# que pedir `rdrand` aquí anula el `register_custom_getrandom!` de libsoso
# aunque el binario de usuario pida `custom`. La entropía la da el kernel.
getrandom = { version = "0.2", features = ["custom"] }
ring = { version = "0.17", features = ["less-safe-getrandom-custom-or-rdrand"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["tls12"] }
rustls-rustcrypto = { version = "0.0.2-alpha", default-features = false, features = ["alloc", "tls12", "zeroize"], optional = true }
webpki-roots = "0.26"
ml-kem = { version = "0.3.3", default-features = false, features = ["zeroize"], optional = true }
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc", "zeroize"], optional = true }
x25519-dalek = { version = "2.0", default-features = false, features = ["zeroize"], optional = true }
rand_core = { version = "0.6", default-features = false }
rustls-pki-types = { version = "1.15", optional = true }
signature3 = { package = "signature", version = "3", default-features = false, optional = true }
[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
