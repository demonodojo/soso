[package]
name = "linked_list_allocator"
version = "0.10.6"
edition = "2018"
license = "MIT OR Apache-2.0"
description = "linked_list_allocator 0.10.6 más rustc-dep-of-std, para el sysroot de soso"
publish = false

[features]
default = ["use_spin"]
use_spin = ["spinning_top"]
use_spin_nightly = ["use_spin"]
alloc_ref = []
const_mut_refs = []
# Lo exige el build de libstd: sin esto el crate busca `core` en un sysroot
# que todavía no existe. El mecanismo es el de `library/rustc-std-workspace-core`.
rustc-dep-of-std = ["dep:core"]

[dependencies]
spinning_top = { version = "0.2.5", optional = true }
core = { version = "1.0.0", optional = true, package = "rustc-std-workspace-core" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
